name: Build Klyne release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        run: base64 -d app/release.jks.b64 > app/release.jks

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace -PappCode=${{ github.run_number }} -PappVersion=1.0.${{ github.run_number }} 2>&1 | tee gradle_build.log

      - name: Capture failure log
        if: failure()
        run: |
          grep -E "(^e:|FAILURE:|What went wrong|Execution failed|error:|Unresolved|Exception)" -A 3 gradle_build.log | tail -n 80 > error_summary.txt || tail -n 80 gradle_build.log > error_summary.txt
          cat error_summary.txt

      - name: Publish failure diagnostic
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-diag
          name: CI Diagnostic
          prerelease: true
          body_path: error_summary.txt

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Klyne-release.apk

      - name: Print APK size
        run: ls -lh Klyne-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Klyne-release-apk
          path: Klyne-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Klyne v1.0.${{ github.run_number }}
          body: |
            Klyne Launcher v1.0.${{ github.run_number }}
            - One UI 9-inspired squircle grid, floating frosted dock, and bottom Finder search
            - Full gesture engine (double-tap to lock, swipe down notifications, pinch home editor)
            - 3 switchable monochrome surface modes (Frosted Glass, OLED Matte, Muted Adaptive)
            - Android 8.0 Oreo+ compatible signed release APK
          files: |
            Klyne-release.apk

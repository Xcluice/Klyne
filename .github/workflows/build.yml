name: Build SnipText release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        run: base64 -d app/release.jks.b64 > app/release.jks

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PappCode=${{ github.run_number }} -PappVersion=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SnipText-release.apk

      - name: Print APK size
        run: ls -lh SnipText-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnipText-release-apk
          path: SnipText-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SnipText v1.0.${{ github.run_number }}
          body: |
            SnipText v1.0.${{ github.run_number }}
            - Press Vol Up + Vol Down anywhere to freeze the screen and select any text region
            - Offline on-device OCR with editable preview, one-tap copy, auto-copy, and line-break joining
            - Hybrid capture engine (Android 11+ native screenshot & Android 8.0-10 MediaProjection)
            - Monochrome animated UI, Quick Settings tile, and recent grab history
          files: |
            SnipText-release.apk

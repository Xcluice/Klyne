name: Build Klyne release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        run: base64 -d app/release.jks.b64 > app/release.jks

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PappCode=${{ github.run_number }} -PappVersion=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Klyne-release.apk

      - name: Print APK size
        run: ls -lh Klyne-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Klyne-release-apk
          path: Klyne-release.apk

      - name: Clean up diagnostic artifacts if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-diag -y --cleanup-tag || true
          git push origin --delete ci-diag || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Klyne v1.0.${{ github.run_number }}
          body: |
            Klyne Launcher v1.0.${{ github.run_number }}
            - One UI 9-inspired squircle grid, floating frosted dock, and bottom Finder search
            - Full gesture engine (double-tap to lock, swipe down notifications, pinch home editor)
            - 3 switchable monochrome surface modes (Frosted Glass, OLED Matte, Muted Adaptive)
            - Android 8.0 Oreo+ compatible signed release APK
          files: |
            Klyne-release.apk
